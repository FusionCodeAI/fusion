[package]
name = "fusion"
version = "2.0.0"
edition = "2021"
description = "Fast, lightweight, cross-platform AI coding assistant with subagents and advisors"
license = "MIT"
repository = "https://github.com/theaungmyatmoe/fusion"

[dependencies]
# Async Runtime
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "io-util", "sync", "time", "fs", "io-std"] }
futures = "0.3"

# Networking & Streaming (Pure Rust TLS - Android/Termux & Windows friendly)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
eventsource-stream = "0.2"

# Serialization & CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Terminal & UI (Lightweight inline Ratatui + Crossterm)
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

# File system, Search & Diffs
ignore = "0.4.22"
globset = "0.4.15"
regex = "1"
similar = "2"
dirs = "6"

# Utility
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# WebAssembly / Browser Bindings
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "Window", "Document", "Headers", "Request", "RequestInit", "RequestMode", "Response"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fusion"
path = "src/main.rs"


[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Headers", "Request", "RequestInit", "RequestMode", "Response"] }


[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "comparison"
harness = false
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
