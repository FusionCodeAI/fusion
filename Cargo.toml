[workspace]
members = [
    ".",
    "crates/fusion-diff",
    "crates/fusion-edit",
    "crates/fusion-iso",
    "crates/fusion-walker",
    "crates/fusion-vcs",
    "crates/fusion-shell",
    "crates/fusion-builtins",
    "crates/fusion-ast",
    "crates/vendor/brush-core",
]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "2.0.0-beta.1"
edition = "2024"
license = "MIT"
authors = ["Fusion Authors"]
repository = "https://github.com/FusionCodeAI/fusion"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"
deprecated = "allow"
unused_mut = "allow"
unused_assignments = "allow"
unreachable_patterns = "allow"
unused_parens = "allow"
non_upper_case_globals = "allow"
[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
collapsible_if = "allow"
field_reassign_with_default = "allow"
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
manual_map = "allow"
manual_range_contains = "allow"
useless_format = "allow"
useless_vec = "allow"
vec_init_then_push = "allow"
single_char_pattern = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure = "allow"
manual_strip = "allow"
format_in_format_args = "allow"
large_enum_variant = "allow"
derivable_impls = "allow"
manual_clamp = "allow"
bool_assert_comparison = "allow"
needless_return = "allow"
let_unit_value = "allow"
write_with_newline = "allow"
redundant_pattern_matching = "allow"
manual_flatten = "allow"
iter_count = "allow"
unnecessary_wraps = "allow"
upper_case_acronyms = "allow"
unnecessary_operation = "allow"
comparison_chain = "allow"
needless_range_loop = "allow"
iter_kv_map = "allow"
unnecessary_cast = "allow"
identity_op = "allow"
explicit_counter_loop = "allow"
needless_lifetimes = "allow"
needless_bool = "allow"
match_like_matches_macro = "allow"
single_match = "allow"
range_plus_one = "allow"
result_large_err = "allow"
redundant_clone = "allow"
len_zero = "allow"
search_is_some = "allow"
manual_find = "allow"
manual_ok_or = "allow"
manual_str_repeat = "allow"
if_same_then_else = "allow"
map_entry = "allow"
double_comparisons = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
bool_to_int_with_if = "allow"
extra_unused_lifetimes = "allow"
new_without_default = "allow"
should_implement_trait = "allow"
format_collect = "allow"
for_kv_map = "allow"
unnecessary_lazy_evaluations = "allow"
redundant_guards = "allow"
manual_is_ascii_check = "allow"
iter_skip_next = "allow"
lines_filter_map_ok = "allow"
manual_pattern_char_comparison = "allow"
into_iter_on_ref = "allow"
redundant_locals = "allow"
iter_without_into_iter = "allow"
unnecessary_literal_unwrap = "allow"
match_str_case_mismatch = "allow"
to_string_in_format_args = "allow"
match_single_binding = "allow"
manual_split_once = "allow"
while_let_on_iterator = "allow"
single_char_add_str = "allow"
let_and_return = "allow"
explicit_auto_deref = "allow"
unnecessary_unwrap = "allow"
unnecessary_get_then_check = "allow"
iter_next_slice = "allow"
match_same_arms = "allow"
deref_addrof = "allow"
cast_abs_to_unsigned = "allow"
clone_on_copy = "allow"
unnecessary_min_or_max = "allow"
unnecessary_map_or = "allow"
unnecessary_fallible_conversions = "allow"
[patch.crates-io]
brush-core = { path = "crates/vendor/brush-core" }

[workspace.dependencies]

# ──────────────────────────────────────────────────────────────────────────────
# Internal Libraries
# ──────────────────────────────────────────────────────────────────────────────
fusion-ast = { path = "crates/fusion-ast" }
fusion-diff = { path = "crates/fusion-diff" }
fusion-edit = { path = "crates/fusion-edit" }
fusion-iso = { path = "crates/fusion-iso" }
fusion-shell = { path = "crates/fusion-shell" }
fusion-walker = { path = "crates/fusion-walker" }
fusion-vcs = { path = "crates/fusion-vcs" }
brush-core = { path = "crates/vendor/brush-core" }
fusion-builtins = { path = "crates/fusion-builtins" }

# ──────────────────────────────────────────────────────────────────────────────
# Async Runtime & Concurrency
# ──────────────────────────────────────────────────────────────────────────────
async-trait = "0.1"
futures = "0.3"
dashmap = "6.1"
parking_lot = "0.12.5"
rayon = "1.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
flume = "0.11"

# ──────────────────────────────────────────────────────────────────────────────
# Serialization & Data Formats
# ──────────────────────────────────────────────────────────────────────────────
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"

# ──────────────────────────────────────────────────────────────────────────────
# Error Handling
# ──────────────────────────────────────────────────────────────────────────────
anyhow = "1.0"
thiserror = "2"
bytes = "1"

# ──────────────────────────────────────────────────────────────────────────────
# CLI & Configuration
# ──────────────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive"] }

# ──────────────────────────────────────────────────────────────────────────────
# Text Processing & Parsing
# ──────────────────────────────────────────────────────────────────────────────
pdf-inspector = "1"
regex = "1"
similar = "3.1.0"
fontdue = { version = "0.9", default-features = false }

# ──────────────────────────────────────────────────────────────────────────────
# Data Structures - Collections
# ──────────────────────────────────────────────────────────────────────────────
phf = { version = "0.13", features = ["macros"] }
heapless = "0.9"
smallvec = { version = "1.15.1", features = [
   "serde",
   "write",
   "union",
   "const_new",
] }

# ──────────────────────────────────────────────────────────────────────────────
# Hashing
# ──────────────────────────────────────────────────────────────────────────────
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }

# ──────────────────────────────────────────────────────────────────────────────
# Audio & Realtime Media
# ──────────────────────────────────────────────────────────────────────────────
audiopus_sys = { version = "0.2.2", features = ["static"] }
opus = "0.3.1"
webrtc = "0.17.2"

# ──────────────────────────────────────────────────────────────────────────────
# System & Platform
# ──────────────────────────────────────────────────────────────────────────────
libc = "0.2"
os_pipe = "1"
windows-sys = { version = "0.61", features = [
   "Win32_Foundation",
   "Win32_Media_Audio",
   "Win32_Media_Multimedia",
   "Win32_Security",
   "Win32_Storage_FileSystem",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
   "Win32_System_IO",
   "Win32_System_Ioctl",
   "Win32_System_Threading",
] }
winreg = "0.56"

# ──────────────────────────────────────────────────────────────────────────────
# Node.js Bindings (NAPI)
# ──────────────────────────────────────────────────────────────────────────────
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-build = "2"
napi-derive = "3"

# ──────────────────────────────────────────────────────────────────────────────
# Terminal & PTY
# ──────────────────────────────────────────────────────────────────────────────
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
clipboard-win = "5.4"
icy_sixel = "0.5"
portable-pty = "0.9"

# ──────────────────────────────────────────────────────────────────────────────
# Search & File Walking
# ──────────────────────────────────────────────────────────────────────────────
globset = "0.4"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

# ──────────────────────────────────────────────────────────────────────────────
# Image Processing & Syntax Highlighting
# ──────────────────────────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
] }
resvg = "0.48"
# Not used directly: activates zune-jpeg's non-default `log` feature so image's
# JPEG decoder compiles — zune-jpeg 0.5.15's no-log stub macros are not
# expression-safe and the crate fails to build without it.
zune-jpeg = { version = "0.5", default-features = false, features = ["log"] }
# Not used directly: pins tinyvec to 1.12.0 because 1.13.0 was published broken
# (cannot find macro `vec` in alloc-only context).
tinyvec = "=1.12.0"
png = "0.18"
inferno = { version = "0.12", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
   "yaml-load",
] }

# ──────────────────────────────────────────────────────────────────────────────
# Markup Conversion
# ──────────────────────────────────────────────────────────────────────────────
html-to-markdown-rs = { version = "3.9.2", default-features = false }

# ──────────────────────────────────────────────────────────────────────────────
# Tokenization
# ──────────────────────────────────────────────────────────────────────────────
zstd = "0.13"
fancy-regex = "0.16"
tiktoken-rs = "0.11"

# ──────────────────────────────────────────────────────────────────────────────
# Shell Parsing
# ──────────────────────────────────────────────────────────────────────────────
brush-parser = "0.3"
# ──────────────────────────────────────────────────────────────────────────────
# Version Control (in-process git + jujutsu)
# ──────────────────────────────────────────────────────────────────────────────
# gix is pinned to the minor jj-lib depends on so both VCS backends share one
# gitoxide stack in the binary. No transport/credential features: network ops
# (clone/fetch/push) deliberately shell out to the git CLI for auth parity.
gix = { version = "0.85", default-features = false, features = [
   "attributes",
   "blob-diff",
   "dirwalk",
   "excludes",
   "index",
   "max-performance-safe",
   "merge",
   "revision",
   "sha1",
   "sha256",
   "status",
   "tree-editor",
   "worktree-mutation",
   "zlib-rs",
] }
jj-lib = { version = "0.44", default-features = false, features = ["git"] }

# ──────────────────────────────────────────────────────────────────────────────
# AST & Tree-Sitter
# ──────────────────────────────────────────────────────────────────────────────
ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
] }
tree-sitter = "0.25"
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7.1"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-elixir = "0.3"
tree-sitter-elisp = "1.6.1"
tree-sitter-erlang = "0.16.0"
tree-sitter-fortran = "0.6.0"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.1.0"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-just = "0.2.0"
tree-sitter-kotlin = { version = "0.4", package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.24.2"
tree-sitter-odin = "1.3"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-python = "0.25"
tree-sitter-r = "1.2.0"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-solidity = "1.2"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-starlark = "1.3"
tree-sitter-svelte = { version = "0.1.1", package = "tree-sitter-svelte-next" }
tree-sitter-swift = "0.7"
tree-sitter-tlaplus = "1.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vue = { version = "0.1.0", package = "tree-sitter-vue-next" }
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

# ──────────────────────────────────────────────────────────────────────────────
# Unsorted (added by `cargo add` - move into a section above)
# ──────────────────────────────────────────────────────────────────────────────

[package]
name = "fusion"
version = "2.0.0-beta.1"
edition = "2021"
description = "Fast, lightweight, cross-platform AI coding assistant with subagents and advisors"
license = "MIT"
repository = "https://github.com/FusionCodeAI/fusion"

[lints]
workspace = true

[dependencies]
# Async Runtime
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "io-util", "sync", "time", "fs", "io-std"] }
futures = "0.3"

# Networking & Streaming (Pure Rust TLS - Android/Termux & Windows friendly)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
eventsource-stream = "0.2"

# Serialization & CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

unicode-width = "0.2"

# Fusion Core Workspace Engines
fusion-diff = { workspace = true }
fusion-edit = { workspace = true }
fusion-iso = { workspace = true }
fusion-walker = { workspace = true }
fusion-vcs = { workspace = true }
fusion-ast = { workspace = true }
fusion-shell = { workspace = true }
fusion-builtins = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
# Archive handling for auto-updates (pure-Rust backend)
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
unicode-width = "0.2"

arboard = { workspace = true }
image = { workspace = true }
# File system, Search & Diffs
ignore = "0.4.22"
globset = "0.4.15"
regex = "1"
similar = "2"
dirs = "6"

# Utility
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# WebAssembly / Browser Bindings
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "Window", "Document", "Headers", "Request", "RequestInit", "RequestMode", "Response"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fusion"
path = "src/main.rs"


[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Headers", "Request", "RequestInit", "RequestMode", "Response"] }


[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
flume = { workspace = true }
bytes = { workspace = true }
brush-core = { workspace = true }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "comparison"
harness = false
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
