<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fusion</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 32px;">
      <a href="/" class="brand-section">
        <!-- Fusion Official Logo (double bracket) -->
        <span class="brand-logo">
          <svg width="18" height="18" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M110 110 H864 V210 H210 V864 H110 Z" fill="currentColor"/>
            <path d="M382 382 H864 V482 H482 V864 H382 Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-title">fusion</span>
      </a>
      <nav>
        <a href="#docs">docs</a>
        <a href="#cli">cli</a>
        <a href="#lib">lib</a>
        <a href="/try" class="active">try</a>
        <a href="https://github.com/FusionCodeAI/fusion" target="_blank" rel="noreferrer">source</a>
      </nav>
    </div>

    <a href="#cli" class="install-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
      </svg>
      <span>install</span>
    </a>
  </header>

  <div class="page-container">
    <div class="demo-description">
      <div>
        This demo runs the full fusion CLI as WebAssembly compiled with the Rust toolchain.<br />
        Networking is delegated to browser fetch, and every SDK aspect is configurable in the docs.
      </div>
      <div class="demo-info-icon">(i)</div>
    </div>

    <div class="terminal-full-wrapper">
      <div id="terminal-container"></div>
    </div>
  </div>

  <script src="/term.js"></script>
</body>
</html>
