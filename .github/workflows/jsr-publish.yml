name: Publish JSR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish package to JSR
        run: |
          cd crates/codegen/xai-grok-pager/npm/fusion
          npx jsr publish --allow-dirty --allow-slow-types
