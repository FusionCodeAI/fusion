name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v2.0.0-alpha.1)'
        required: false
        default: 'v2.0.0-alpha.1'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2

jobs:
  # ── Tag Validation ──────────────────────────────────────────────────────────
  tag-check:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and Validate Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            tag_ver="${tag#v}"
            if [[ "${tag_ver}" != "${cargo_ver}" ]]; then
              echo "::warning::Tag version (${tag_ver}) differs from Cargo.toml version (${cargo_ver})"
            else
              echo "✅ Tag and Cargo.toml agree (${tag_ver})"
            fi
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
            tag_ver="${tag#v}"
          else
            tag="v${cargo_ver}"
            tag_ver="${cargo_ver}"
          fi
          if [[ "${tag}" == *"alpha"* || "${tag}" == *"beta"* || "${tag}" == *"rc"* || "${tag}" == *"v2"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${tag_ver}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Target Release: ${tag} (version ${tag_ver}, prerelease=${tag_ver})"
  # ── Multi-Platform Binary Matrix Build ──────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: tag-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux AArch64 (static musl via cross) ───────────────────────────
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: fusion
            archive_ext: tar.gz
            use_cross: true
            android: false

          # ── Android / Termux ARM64 (native NDK) ─────────────────────────────
          - target: aarch64-linux-android
            os: ubuntu-latest
            binary: fusion
            archive_ext: tar.gz
            use_cross: false
            android: true

          # ── macOS Apple Silicon (ARM64) ─────────────────────────────────────
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: fusion
            archive_ext: tar.gz
            use_cross: false
            android: false

          # ── Windows x86_64 (MSVC) ───────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: fusion.exe
            archive_ext: zip
            use_cross: false
            android: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (!matrix.use_cross && matrix.target) || '' }}

      - name: Install Linux build dependencies (musl-tools)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Android NDK
        if: matrix.android
        id: setup-ndk
        run: |
          rustup target add ${{ matrix.target }}
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME}" ]; then
            NDK_ROOT="${ANDROID_NDK_HOME}"
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_ROOT="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -1)"
          else
            NDK_ROOT="${ANDROID_HOME}/ndk-bundle"
          fi
          echo "NDK_ROOT=${NDK_ROOT}" >> "$GITHUB_ENV"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=${TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"

      - name: Install cross-compilation tool (cross)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # ── Compilation ────────────────────────────────────────────────────────
      - name: Build Binary (Native / Rustup)
        if: "!matrix.use_cross"
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Build Binary (Cross)
        if: matrix.use_cross
        shell: bash
        run: |
          cross build --release --target ${{ matrix.target }}

      # ── Symbol Stripping ───────────────────────────────────────────────────
      - name: Strip Debug Symbols (Unix)
        if: "!matrix.android && runner.os != 'Windows'"
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            strip -x "${BIN_PATH}" 2>/dev/null || true
          else
            strip --strip-all "${BIN_PATH}" 2>/dev/null || strip "${BIN_PATH}" 2>/dev/null || true
          fi

      - name: Strip Debug Symbols (Android)
        if: matrix.android
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          llvm-strip --strip-all "${BIN_PATH}" 2>/dev/null || strip "${BIN_PATH}" 2>/dev/null || true

      # ── Packaging ──────────────────────────────────────────────────────────
      - name: Package Distribution Archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.tag-check.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          BINARY="${{ matrix.binary }}"
          BIN_SRC="target/${TARGET}/release/${BINARY}"

          mkdir -p dist staging
          cp "${BIN_SRC}" "staging/${BINARY}"
          chmod +x "staging/${BINARY}"
          # Bundle fusion2 alias binary as well
          if [[ "${BINARY}" == *".exe" ]]; then
            cp "${BIN_SRC}" "staging/fusion2.exe"
          else
            cp "${BIN_SRC}" "staging/fusion2"
            chmod +x "staging/fusion2"
          fi
          [ -f "README.md" ] && cp "README.md" "staging/"
          [ -f "LICENSE" ] && cp "LICENSE" "staging/"

          ARCHIVE_BASE="fusion-${TAG}-${TARGET}"
          TAR_FILE="dist/${ARCHIVE_BASE}.tar.gz"
          ZIP_FILE="dist/${ARCHIVE_BASE}.zip"

          # 1. Create .tar.gz
          ( cd staging && tar -czf "../${TAR_FILE}" * )

          # 2. Create .zip
          if command -v zip >/dev/null 2>&1; then
            ( cd staging && zip -q -9 -r "../${ZIP_FILE}" * )
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import shutil; shutil.make_archive('dist/${ARCHIVE_BASE}', 'zip', 'staging')"
          fi

          # 3. Generate SHA256 Checksums
          cd dist
          for file in "${ARCHIVE_BASE}".*; do
            if [ -f "$file" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$file" > "${file}.sha256"
              else
                shasum -a 256 "$file" > "${file}.sha256"
              fi
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [tag-check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: all-artifacts
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp all-artifacts/* release-assets/

          cd release-assets
          # Collect all archive files (.tar.gz and .zip), compute combined checksum file
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} + | sort -k2 | sed 's|\./||' > SHA256SUMS.txt

          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-check.outputs.tag }}
          name: Fusion ${{ needs.tag-check.outputs.tag }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.tag-check.outputs.prerelease == 'true' }}
          body: |
            ## Fusion ${{ needs.tag-check.outputs.tag }}

            Fast, lightweight, cross-platform AI coding assistant with subagents and advisors.

            ### 🚀 Quick Install (macOS / Linux / Termux)

            ```bash
            curl -fsSL https://fusioncode.app/install | bash
            ```

            ### 📦 Homebrew (macOS / Linux)

            ```bash
            brew install theaungmyatmoe/fusion/fusion
            ```

            ### 📱 Termux (Android)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/termux-bootstrap.sh | bash
            ```

            ---

            ### 📥 Pre-compiled Release Binaries

            | Platform / Architecture | Archive | Checksum |
            |-------------------------|---------|----------|
            | **macOS Apple Silicon** (ARM64) | [`fusion-${{ needs.tag-check.outputs.tag }}-aarch64-apple-darwin.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-aarch64-apple-darwin.tar.gz) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-aarch64-apple-darwin.tar.gz.sha256) |
            | **macOS Intel** (x86_64) | [`fusion-${{ needs.tag-check.outputs.tag }}-x86_64-apple-darwin.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-apple-darwin.tar.gz) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-apple-darwin.tar.gz.sha256) |
            | **Linux x86_64** (glibc) | [`fusion-${{ needs.tag-check.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz.sha256) |
            | **Linux x86_64** (musl static) | [`fusion-${{ needs.tag-check.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz.sha256) |
            | **Linux AArch64** (musl static) | [`fusion-${{ needs.tag-check.outputs.tag }}-aarch64-unknown-linux-musl.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-aarch64-unknown-linux-musl.tar.gz) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-aarch64-unknown-linux-musl.tar.gz.sha256) |
            | **Android / Termux** (ARM64) | [`fusion-${{ needs.tag-check.outputs.tag }}-aarch64-linux-android.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-aarch64-linux-android.tar.gz) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-aarch64-linux-android.tar.gz.sha256) |
            | **Windows x64** (MSVC) | [`fusion-${{ needs.tag-check.outputs.tag }}-x86_64-pc-windows-msvc.zip`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-pc-windows-msvc.zip) | [`.sha256`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/fusion-${{ needs.tag-check.outputs.tag }}-x86_64-pc-windows-msvc.zip.sha256) |

            *Verification checksums for all release packages are available in [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-check.outputs.tag }}/SHA256SUMS.txt).*

  # ── TypeScript / WebAssembly SDK NPM Publish ────────────────────────────────
  publish-sdk:
    name: Publish TypeScript SDK (@fusion/sdk)
    needs: [tag-check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Publish SDK
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd sdk

          echo "Installing SDK dependencies..."
          npm ci || npm install

          TAG_VERSION="${{ needs.tag-check.outputs.version }}"
          if [ -n "$TAG_VERSION" ]; then
            echo "Updating sdk package.json version to ${TAG_VERSION}..."
            npm version "${TAG_VERSION}" --no-git-tag-version --allow-same-version || true
          fi

          echo "Building SDK TypeScript and type declarations..."
          npm run build

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing @fusion/sdk to npm registry..."
            npm publish --access public --provenance || npm publish --access public
          else
            echo "⚠️ NPM_TOKEN secret not configured; skipping npm publish (dry-run)."
            npm pack --dry-run
          fi
