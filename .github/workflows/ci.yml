name: CI

on:
  push:
    branches: [ main, v2, dev, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, v2, dev ]

# Cancel superseding runs for the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Code Quality: Formatting & Clippy ───────────────────────────────────────
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all --check

      - name: Run clippy linter
        run: cargo clippy --all-targets --all-features
  # ── Security Audit ──────────────────────────────────────────────────────────
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Cross-Platform Test Matrix ──────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit & integration tests
        run: cargo test --all-targets --verbose

      - name: Run documentation tests
        run: cargo test --doc

  # ── WASM Target Build Verification ─────────────────────────────────────────
  wasm:
    name: WASM Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          targets: wasm32-unknown-unknown

      - name: Verify WASM target build (with features)
        run: cargo build --target wasm32-unknown-unknown --features wasm --verbose

      - name: Verify WASM target check (core)
        run: cargo check --target wasm32-unknown-unknown

  # ── TypeScript SDK Typecheck & Tests ───────────────────────────────────────
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sdk/package.json

      - name: Install SDK dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript SDK
        run: npm run typecheck

      - name: Build TypeScript SDK
        run: npm run build

      - name: Run TypeScript SDK tests
        run: npm test
