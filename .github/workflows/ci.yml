name: CI

on:
  push:
    branches: [ main, v2, dev, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, v2, dev ]

# Cancel superseding runs for the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Code Quality: Formatting & Clippy ───────────────────────────────────────
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt --all --check

      - name: Run clippy linter
        run: cargo clippy --lib --bins --tests
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        run: cargo audit
  # ── Cross-Platform Test Matrix ──────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit & integration tests
        shell: bash
        run: |
          cargo test --lib ui::prompt
          cargo test --lib ui::slash
          cargo test --lib ui::markdown
          cargo test --lib ui::repl
          cargo test --lib ui::notify
          cargo test --lib provider::usage
          cargo test --lib agent::skill_state
          cargo test --lib acp
          cargo test --test usage_integration_test
          cargo test --test skill_state_test
          cargo test --test wasm_test
          cargo test --test tui_fx_style_test
          cargo test --test updater_test
          cargo test --test strace_test
          cargo test --bin fusion
  # ── Android / Termux AArch64 Cross-Compile Verification ─────────────────────
  android:
    name: Android AArch64 Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME}" ]; then
            NDK_ROOT="${ANDROID_NDK_HOME}"
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_ROOT="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -1)"
          else
            NDK_ROOT="${ANDROID_HOME}/ndk-bundle"
          fi
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN}" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=${TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"

      - name: Verify Android build
        run: cargo build --target aarch64-linux-android --verbose
  # ── WebAssembly & TypeScript SDK Verification ──────────────────────────────
  wasm-sdk:
    name: WASM & TypeScript SDK Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust WASM integration tests
        run: cargo test --test wasm_test

      - name: Test TypeScript SDK (typecheck and unit tests)
        working-directory: sdk
        run: |
          bun install
          bun run typecheck
          bun test
