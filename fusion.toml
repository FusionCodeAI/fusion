# Fusion — mobile-first AI coding agent
# Config file (Codex-style TOML, primary format)
#
# Place this at:
#   ./fusion.toml           (project-level, highest priority)
#   ~/.config/fusion/fusion.toml  (global)
#   ~/.fusion/fusion.toml   (global fallback)
#
# Environment variables always override file config.
# Also supports zencode.json (JSON) for backward compatibility.

# Model to use (default: MiniMax M2.7 via the Fusion Gateway).
# The Fusion Gateway (api.fusioncode.app) authenticates with the `fc_` API
# key saved by `fusion login`. Gateway-supported models:
#   MiniMaxAI/MiniMax-M2.7  (default),  moonshotai/Kimi-K2.6,  fusion,  kimi
model = "MiniMaxAI/MiniMax-M2.7"
# small_model = "MiniMaxAI/MiniMax-M2.7"

# Auto-approve all tool actions (use carefully!)
yolo = false

[provider]
# Fusion Gateway is the primary (main) provider. OAuth/xAI/OpenAI are
# secondary. `fusion login` saves the API key under [provider.fusion].
default = "fusion"

# Prefer real credentials in ~/.config/fusion/fusion.toml or env vars.
# Template placeholders here are ignored by the loader, but keeping them
# commented avoids confusion when debugging auth setup.
# [provider.cloudflare]
# account_id = "your_cloudflare_account_id"
# api_key = "your_cloudflare_api_token"

# [provider.xai]
# api_key = "xai-your-key"
# base_url = "https://api.x.ai/v1"

# [provider.openai]
# api_key = "sk-your-key"
# base_url = "https://api.openai.com/v1"

[settings]
# theme = "system"
